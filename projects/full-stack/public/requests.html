<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project requests | North Studio</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header wrap"><a class="logo" href="index.html">North Studio<span>Project request dashboard</span></a><a href="index.html">Back to landing page</a></header>
<main class="wrap dashboard"><h1>Project requests</h1><p>Review, update, and remove requests submitted from your landing page.</p>
